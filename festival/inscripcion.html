<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción — Festival de Música 2026</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>Formulario de inscripción</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="inscripcion.html">Inscripción</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== FORMULARIO ===== -->
    <section id="formulario">
        <h2>Completá tus datos</h2>

        <form action="#" method="post">

            <!-- Datos personales -->
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="1" max="120" placeholder="Tu edad">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

            <label for="sitio">Sitio web personal:</label>
            <input type="url" id="sitio" name="sitio" placeholder="https://tusitio.com">

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej: 2664-123456">

            <label for="nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="nacimiento" name="nacimiento">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">

            <label for="color">Color favorito:</label>
            <input type="color" id="color" name="color" value="#ff0000">

            <!-- Género: botones radio -->
            <fieldset>
                <legend>Género</legend>
                <input type="radio" id="masculino" name="genero" value="masculino">
                <label for="masculino">Masculino</label>

                <input type="radio" id="femenino" name="genero" value="femenino">
                <label for="femenino">Femenino</label>

                <input type="radio" id="otro" name="genero" value="otro">
                <label for="otro">Otro</label>
            </fieldset>

            <!-- Intereses: checkbox -->
            <fieldset>
                <legend>Intereses musicales</legend>
                <input type="checkbox" id="rock" name="intereses" value="rock">
                <label for="rock">Rock</label>

                <input type="checkbox" id="pop" name="intereses" value="pop">
                <label for="pop">Pop</label>

                <input type="checkbox" id="folklore" name="intereses" value="folklore">
                <label for="folklore">Folklore</label>

                <input type="checkbox" id="electronica" name="intereses" value="electronica">
                <label for="electronica">Electrónica</label>
            </fieldset>

            <!-- Campo oculto -->
            <input type="hidden" name="festival" value="festival2026">

            <!-- Botones -->
            <button type="submit">Enviar</button>
            <button type="reset">Limpiar</button>

        </form>
    </section>

    <footer>
        <p>Festival de Música 2026 — Todos los derechos reservados.</p>
        <a href="index.html">Volver al inicio</a>
    </footer>

</body>
</html>
